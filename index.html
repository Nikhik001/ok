
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070c">
<title>Ready for 26 October</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #08070c;
  color: white;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
}

body {
  overflow: hidden;
}

.scene {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #08070c;
}

.scene.active {
  display: flex;
  animation: reveal .25s ease-out;
}

@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

.poster {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#intro {
  background: #f5f3f5;
}

#intro img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.intro-overlay {
  position: absolute;
  inset: auto 0 0;
  padding: 32px 18px 28px;
  text-align: center;
  background: linear-gradient(transparent, rgba(0,0,0,.94));
}

.enter {
  border: 2px solid white;
  background: #c70d2c;
  color: white;
  font-size: clamp(18px, 4vw, 28px);
  letter-spacing: 2px;
  padding: 14px 25px;
  cursor: pointer;
  box-shadow: 0 0 25px #e20b3b88;
}

.hint {
  font: 12px Arial, sans-serif;
  opacity: .8;
  margin-top: 10px;
}

#videoScene video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#final {
  flex-direction: column;
  text-align: center;
  padding: 24px;
  background: radial-gradient(circle, #34102b, #110a18 55%, #030305);
}

#final::before {
  content: "✦  ✧  ✦  ✧  ✦";
  color: #ffd54a;
  letter-spacing: 12px;
  font-size: clamp(18px, 4vw, 34px);
  margin-bottom: 22px;
}

.ready {
  font-size: clamp(22px, 5vw, 44px);
  color: white;
  letter-spacing: .18em;
  text-shadow: 0 0 20px #ff2f75;
  margin: 0 0 8px;
}

.date {
  font-size: clamp(44px, 11vw, 110px);
  line-height: .98;
  color: #ffcf40;
  text-shadow: 4px 4px 0 #e32454, 0 0 32px #ffcf4070;
  margin: 0;
}

.sub {
  font: 15px Arial, sans-serif;
  letter-spacing: .25em;
  margin-top: 25px;
  color: #f4d7e4;
}

.replay {
  margin-top: 28px;
  background: transparent;
  border: 1px solid #fff8;
  color: white;
  padding: 10px 18px;
  cursor: pointer;
  font: 14px Arial, sans-serif;
}

#used {
  flex-direction: column;
  text-align: center;
  padding: 24px;
  background: radial-gradient(circle, #251020, #08070c 70%);
}

#used h1 {
  color: #ffcf40;
  font-size: clamp(30px, 8vw, 60px);
  text-shadow: 0 0 20px #ff2f75;
}

#used p {
  font: 16px Arial, sans-serif;
  line-height: 1.6;
  color: #f4d7e4;
}

@media (max-width: 600px) {
  .intro-overlay {
    padding-bottom: 20px;
  }

  .enter {
    font-size: 18px;
    padding: 12px 16px;
  }

  .sub {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<main id="intro" class="scene active">
  <img src="intro.jpg" alt="Enter at your own risk skull poster">

  <div class="intro-overlay">
    <button class="enter" id="enterBtn">
      ENTER AT YOUR OWN RISK
    </button>
    <div class="hint">Tap to begin the experience</div>
  </div>
</main>

<section id="videoScene" class="scene">
  <video id="partyVideo" playsinline preload="auto">
    <source src="party-video.mp4" type="video/mp4">
    Your browser does not support HTML video.
  </video>
</section>

<section id="imageOne" class="scene">
  <img class="poster" src="party-entrance.png" alt="Party entrance">
</section>

<section id="imageTwo" class="scene">
  <img class="poster" src="party-pass.jpg" alt="Party pass">
</section>

<section id="final" class="scene">
  <p class="ready">READY FOR</p>
  <h1 class="date">26 OCTOBER</h1>
  <div class="sub">THE COUNTDOWN IS ON</div>
  <button class="replay" id="replayBtn">Replay from beginning</button>
</section>

<section id="used" class="scene">
  <h1>YOU'VE ALREADY ENTERED!</h1>
  <p>This invitation has already been opened in this browser.</p>
  <p>🔥 See you on 26 October! 🔥</p>
</section>

<script>
const scenes = [
  'intro',
  'videoScene',
  'imageOne',
  'imageTwo',
  'final',
  'used'
];

const video = document.getElementById('partyVideo');
const enterBtn = document.getElementById('enterBtn');
const replayBtn = document.getElementById('replayBtn');

const VISIT_KEY = 'partySiteVisited_v2';

let experienceStarted = false;
let imageTimerOne;
let imageTimerTwo;

function show(id) {
  scenes.forEach(sceneId => {
    document.getElementById(sceneId)
      .classList.toggle('active', sceneId === id);
  });
}

// Check whether this browser has visited before.
let alreadyVisited = false;

try {
  alreadyVisited = localStorage.getItem(VISIT_KEY) === 'yes';
} catch (error) {
  console.error('Could not read visit status.', error);
}

if (alreadyVisited) {
  show('used');
} else {
  show('intro');
}

// Save the visit before starting the experience.
async function startExperience() {
  if (experienceStarted) return;

  try {
    localStorage.setItem(VISIT_KEY, 'yes');
  } catch (error) {
    alert('Your browser could not save this visit.');
    return;
  }

  experienceStarted = true;
  show('videoScene');
  video.currentTime = 0;

  try {
    await video.play();
  } catch (error) {
    video.controls = true;
  }
}

enterBtn.addEventListener('click', startExperience);

// Show the first image for 2 seconds,
// then the second image for 3 seconds.
video.addEventListener('ended', () => {
  show('imageOne');

  imageTimerOne = setTimeout(() => {
    show('imageTwo');

    imageTimerTwo = setTimeout(() => {
      show('final');
    }, 3000);

  }, 2000);
});

// Replay is available during the current visit.
replayBtn.addEventListener('click', () => {
  clearTimeout(imageTimerOne);
  clearTimeout(imageTimerTwo);

  video.pause();
  video.currentTime = 0;
  video.controls = false;

  experienceStarted = false;
  show('intro');
});
</script>

</body>
</html>
