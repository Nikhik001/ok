<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070c">
<title>Ready for 26 October</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #08070c; color: #fff; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; }
  body { overflow: hidden; }
  .scene { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #08070c; }
  .scene.active { display: flex; animation: reveal .25s ease-out; }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  .poster { width: 100%; height: 100%; object-fit: contain; }
  #intro { background: #f5f3f5; }
  #intro img { width: 100%; height: 100%; object-fit: contain; }
  .intro-overlay { position: absolute; inset: auto 0 0; padding: 32px 18px 28px; text-align: center; background: linear-gradient(transparent, rgba(0,0,0,.94)); }
  .enter { border: 2px solid #fff; background: #c70d2c; color: white; font-size: clamp(18px, 4vw, 28px); letter-spacing: 2px; padding: 14px 25px; cursor: pointer; box-shadow: 0 0 25px #e20b3b88; }
  .hint { font: 12px Arial, sans-serif; opacity: .8; margin-top: 10px; }
  #videoScene video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #final { flex-direction: column; text-align: center; padding: 24px; background: radial-gradient(circle at center, #34102b 0, #110a18 45%, #030305 100%); }
  #final::before { content: "✦  ✧  ✦  ✧  ✦"; color: #ffd54a; letter-spacing: 12px; font-size: clamp(18px, 4vw, 34px); margin-bottom: 22px; }
  .ready { font-size: clamp(22px, 5vw, 44px); color: #fff; letter-spacing: .18em; text-shadow: 0 0 20px #ff2f75; margin: 0 0 8px; }
  .date { font-size: clamp(44px, 11vw, 110px); line-height: .98; color: #ffcf40; text-shadow: 4px 4px 0 #e32454, 0 0 32px #ffcf4070; margin: 0; }
  .sub { font: 15px Arial, sans-serif; letter-spacing: .25em; margin-top: 25px; color: #f4d7e4; }
  .replay { margin-top: 28px; background: transparent; border: 1px solid #fff8; color: white; padding: 10px 18px; cursor: pointer; font: 14px Arial, sans-serif; }
  @media (max-width: 600px) { .intro-overlay { padding-bottom: 20px; } .poster { object-fit: contain; } }
</style>
</head>
<body>
  <main id="intro" class="scene active">
    <img src="intro.jpg" alt="Enter at your own risk skull poster">
    <div class="intro-overlay">
      <button class="enter" id="enterBtn">ENTER AT YOUR OWN RISK</button>
      <div class="hint">Tap to begin the experience</div>
    </div>
  </main>
  <section id="videoScene" class="scene" aria-label="Party video">
    <video id="partyVideo" playsinline preload="auto">
      <source src="party-video.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
  </section>
  <section id="imageOne" class="scene"><img class="poster" src="party-entrance.png" alt="Colourful party entrance"></section>
  <section id="imageTwo" class="scene"><img class="poster" src="party-pass.jpg" alt="Funny party pass poster"></section>
  <section id="final" class="scene">
    <p class="ready">READY FOR</p>
    <h1 class="date">26 OCTOBER</h1>
    <div class="sub">THE COUNTDOWN IS ON</div>
    <button class="replay" id="replayBtn">Replay from beginning</button>
  </section>
<script>
const scenes = ['intro', 'videoScene', 'imageOne', 'imageTwo', 'final'];
const video = document.getElementById('partyVideo');
function show(id) {
  scenes.forEach(sceneId => document.getElementById(sceneId).classList.toggle('active', sceneId === id));
}
async function startExperience() {
  show('videoScene');
  video.currentTime = 0;
  try { await video.play(); }
  catch (err) {
    // If autoplay is blocked by the browser, show a play control.
    video.controls = true;
    show('videoScene');
  }
}
document.getElementById('enterBtn').addEventListener('click', startExperience);
video.addEventListener('ended', () => {
  show('imageOne');
  setTimeout(() => {
    show('imageTwo');
    setTimeout(() => show('final'), 3000);
  }, 2000);
});
document.getElementById('replayBtn').addEventListener('click', () => {
  video.pause();
  video.currentTime = 0;
  video.controls = false;
  show('intro');
});
</script>
</body>
</html>
